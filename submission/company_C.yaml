sources:
  - name: AP
    file: invoice_lines.csv
    role: primary
    id: line_id
    id_prefix: ""
    columns:
      amount: line_amount_usd
      date: invoice_date
      fallback_date: status_date
      supplier_name: supplier_name
      description: [line_description, product_service_description]
      material: product_service_code
      quantity: quantity
      invoice_number: invoice_number
      invoice_line: invoice_line
      status: status
      gl_text: [gl_account_description]
      context: [gl_account_description, invoice_description]
    amount_is_gross: false
    currency: USD

dates:
  formats: ["%m/%d/%Y", "%Y-%m-%d", "%m/%d/%y"]
  dayfirst: false
  valid_range: ["2020-01-01", "2026-12-31"]

duplicates:
  # one invoice has many lines with the same amount and quantity (e.g. per-BBL charges), so
  # a repeat must match on the invoice line number too
  keys: [invoice_number, invoice_line, supplier_name, amount_raw, description]

extra_exclusion_rules:
  - name: partner_billing_jib
    reason: NON_PROCUREMENT
    fields: [context]
    pattern: '\bJIB\b|joint interest'
  - name: revenue_tax_royalty_accounts
    reason: NON_PROCUREMENT
    fields: [gl_text]
    pattern: 'revenue|royalty|ad valorem|severance tax|impact fee|other tax|debt issuance|penalty and fees|director fees|employee deductions|receivable|investor services|donations|community giving|public filing fees|deposits clearing|O&G App Properties'
  - name: tax_lines
    reason: NON_PROCUREMENT
    fields: [description]
    pattern: '^\W*ad valorem|inventory tax|netted against revenue'
